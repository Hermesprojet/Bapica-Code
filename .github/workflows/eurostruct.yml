name: EUROSTRUCT

# Cahier des charges section 5.2:
#   "le pipeline echoue si un seul test de validation normative regresse"
#
# Nothing here is allowed to be advisory. A golden test that drifts, a National
# Annex parameter promoted without a named verifier, or a TypeScript contract
# out of sync with the Pydantic models all fail the build.

on:
  push:
    paths:
      - 'eurostruct/**'
      - '.github/workflows/eurostruct.yml'
  pull_request:
    paths:
      - 'eurostruct/**'
      - '.github/workflows/eurostruct.yml'

defaults:
  run:
    working-directory: eurostruct

jobs:
  engine:
    name: Moteur de calcul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e "engine[dev]"

      - name: Tests
        # -W error: a warning in a calculation engine is a defect, not noise.
        run: cd engine && python -m pytest tests/ -q -W error

      - name: Cas de reference normatifs
        run: cd engine && python -m pytest tests/ -q -m reference

      - name: Non-regression (golden)
        run: cd engine && python -m pytest tests/ -q -m golden

      - name: Proprietes (monotonie, limites, homogeneite)
        run: cd engine && python -m pytest tests/ -q -m property

      - name: Le contrat TypeScript est a jour
        run: |
          cd engine && python scripts/export_contracts.py
          cd .. && git diff --exit-code -- packages/contracts \
            || { echo "::error::Le contrat TypeScript est desynchronise des modeles Pydantic. Executer: cd engine && python scripts/export_contracts.py"; exit 1; }

      - name: Le seed NDP est a jour
        run: |
          python db/seed/generate_ndp_seed.py > db/seed/0001_ndp.sql
          git diff --exit-code -- db/seed/0001_ndp.sql \
            || { echo "::error::Le seed NDP est desynchronise des JSON du moteur."; exit 1; }

      - name: Suite de validation normative (cas de reference)
        # TICKET 2.2: un ecart hors tolerance sur un cas rejouable fait echouer
        # la CI. Les lacunes de couverture sont rapportees, pas bloquantes.
        run: cd engine && python scripts/run_reference_suite.py --json ../reference-report.json

      - name: Audit de l'arbre de dependances du moteur
        # TICKET 3.1 et 6.2: allowlist sur tout l'arbre transitif, denylist des
        # clients IA et piles HTTP, scan des imports y compris differes.
        # Un grep ne suffirait pas: un client de modele peut arriver trois
        # niveaux plus bas sans qu'aucun import n'apparaisse dans notre code.
        run: cd engine && python scripts/audit_engine_dependencies.py

      - name: Le moteur tourne hors ligne
        run: cd engine && python -m pytest tests/test_engine_isolation.py -q

      - name: Pipeline d'import documentaire
        # Paquet SEPARE du moteur: il depend d'un parseur PDF, que l'audit de
        # dependances du moteur refuse. Les deux echangent du JSON.
        run: |
          pip install -e "tools/ndp_import[dev]"
          cd tools/ndp_import && python -m pytest tests/ -q

      - name: L'importeur n'a pas contamine le moteur
        run: |
          python - <<'EOF'
          import importlib.metadata as md, re, sys
          deps = [re.split(r'[<>=!~;\[ ]', r)[0]
                  for r in (md.requires('eurostruct-engine') or [])
                  if 'extra ==' not in r]
          if 'pdfplumber' in deps:
              print("::error::pdfplumber a fui dans les dependances du moteur")
              sys.exit(1)
          print("moteur:", deps)
          EOF

      - name: Documents officiels manquants
        # Informatif: rend visible, a chaque build, ce qui bloque le mode strict.
        run: cd tools/ndp_import && python -m ndp_import.cli catalogue

      - name: Rapport de validation normative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report
          path: reference-report.json
          if-no-files-found: ignore

  schema:
    name: Schema de donnees
    runs-on: ubuntu-latest
    services:
      postgres:
        # NULLS NOT DISTINCT requires PostgreSQL >= 15.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # Le moteur est REQUIS par ce job depuis 6.3b3: `db/test/run.sh` execute
      # le contrat croise, qui fait produire un vrai paquet de revue par
      # `eurostruct_engine.ndp.canonical` avant de l'inserer. Sans lui, la
      # suite echoue sur `ModuleNotFoundError: pint` — c'est exactement ce qui
      # a rendu ce job rouge alors qu'il etait vert au jalon precedent.
      #
      # Ce job ne SKIPPE jamais le contrat croise faute d'interpreteur: une
      # surface non executee doit etre aussi visible qu'une surface en echec,
      # et `cross_contract.sh` echoue explicitement dans ce cas.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Moteur (requis par le contrat croise)
        run: pip install -e engine

      # LE PILOTE POSTGRESQL, POUR LE CONTRAT DU PROVIDER.
      #
      # `db/test/provider_contract.sh` eprouve des proprietes qui n'existent
      # que contre un vrai serveur: `SET LOCAL` meurt-il avec la transaction,
      # une connexion reprise porte-t-elle encore l'identite precedente. Sans
      # pilote, il rend 4 (NON EXECUTE) et `run.sh` le compte comme une
      # surface manquante, donc rouge — c'est voulu, et cette etape existe
      # pour que le rouge ne soit jamais du a l'outillage.
      #
      # LE PAQUET N'EST PAS UNE DEPENDANCE DU MOTEUR, et ne doit pas le
      # devenir: `postgres_provider.py` n'importe aucun pilote — il recoit une
      # connexion qui satisfait un Protocol. Le moteur reste donc installable
      # sans base, et `engine/tests` continue de le prouver.
      - name: Pilote PostgreSQL (contrat du provider)
        run: pip install psycopg2-binary

      # LA TRANCHE APPLICATIVE, PARCE QUE `run.sh` L'EXECUTE MAINTENANT.
      #
      # `db/test/api_e2e.sh` est entre dans `run.sh` au commit 2e342ec. Ce job
      # n'installait pas le paquet: le harnais rendait 4 (NON EXECUTE), et
      # `run.sh` sort en 1 des qu'une surface n'a pas tourne — c'est voulu,
      # une garantie qu'on n'a pas pu verifier n'est pas verte. Le job est
      # donc rouge depuis 2e342ec, pour l'outillage et non pour le produit.
      #
      # L'extra `dev` porte `httpx`, qu'exige `fastapi.testclient.TestClient`.
      # C'est exactement l'ecart qui avait rendu l'autre workflow rouge: le
      # poste de developpement l'avait installe a la main, le runner non.
      #
      # L'ETAPE VERIFIE SON PROPRE EFFET. Installer sans controler laisserait
      # le harnais rendre 4 en silence, et le rouge reviendrait sans dire
      # pourquoi.
      - name: Tranche applicative (surface api_e2e de run.sh)
        run: |
          pip install -e "api[dev]"   # `defaults.working-directory: eurostruct`
          python - <<'PY'
          import eurostruct_api, fastapi, jwt
          from fastapi.testclient import TestClient   # exige httpx
          print("API prete:", fastapi.__version__, "| TestClient importable")
          PY

      # La preuve, AVANT de laisser les harnais toucher le cluster: leurs
      # barrieres refusent-elles vraiment ? L'auto-test les met en echec seize
      # fois, avec des temoins portant les noms canoniques, et verifie qu'ils
      # survivent. Il tourne d'abord: si une barriere cedait, l'etape suivante
      # serait precisement celle qui detruirait des roles.
      #
      # Le nombre n'est pas decoratif: il est rapporte par le script lui-meme
      # et par `run_tests.sh`. L'ecrire ici faux ferait passer une barriere
      # perdue pour un choix.
      - name: Securite des harnais (preuve des barrieres)
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          # L'auto-test est soumis aux memes gardes que ce qu'il teste: il cree
          # et detruit lui aussi des roles globaux portant les noms canoniques.
          # Le consentement lui est donc donne EXPLICITEMENT ici, comme aux
          # autres — jamais par une exemption interne au script.
          EUROSTRUCT_CLUSTER_JETABLE: oui-cluster-jetable-et-isole
        run: ./db/test/harness_safety_selftest.sh

      # `db/test/cross_cluster_restore.sh` cree un SECOND CLUSTER par `initdb`
      # pour exercer une restauration reelle. `initdb` est dans le paquet
      # SERVEUR, pas dans le client — et le service `postgres:16` de ce job est
      # un CONTENEUR: ses binaires ne sont pas sur le runner.
      #
      # SANS CE PAQUET, LE HARNAIS REND 4 (NON EXECUTE) et `run.sh` le compte
      # comme une surface manquante, donc rouge. C'est voulu: une garantie
      # qu'on n'a pas pu verifier ne doit pas passer pour verte. Cette etape
      # existe pour que le rouge ne soit jamais du a l'outillage.
      #
      # Le cluster local eventuellement demarre par le paquet est ARRETE: le
      # port 5432 du runner est deja pris par le mappage du service.
      - name: Serveur PostgreSQL local (second cluster de restauration)
        run: |
          set -u
          trouve() { ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 \
                     || command -v initdb >/dev/null 2>&1; }
          if ! trouve; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq postgresql-16 || sudo apt-get install -y -qq postgresql || true
          fi
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo pg_ctlcluster 16 main stop 2>/dev/null || true
          if ! trouve; then
            echo "ECHEC: initdb reste introuvable apres installation." >&2
            echo "       cross_cluster_restore.sh ne pourrait pas s'executer," >&2
            echo "       et une surface non executee n'est pas une surface verte." >&2
            exit 1
          fi
          ls -1 /usr/lib/postgresql/*/bin/initdb 2>/dev/null || command -v initdb

      - name: Migrations et garanties structurelles
        # RLS tenant isolation, the human validation gate, immutability of
        # signed records, the ten-year retention guard.
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          # Le conteneur `services:` de ce job est cree pour lui et detruit
          # avec lui: c'est un cluster jetable au sens exact ou la porte
          # l'entend. La declaration est faite ICI, dans le workflow, et non
          # dans les scripts — un harnais qui se donnerait a lui-meme son
          # consentement ne serait plus une barriere.
          EUROSTRUCT_CLUSTER_JETABLE: oui-cluster-jetable-et-isole
        run: ./db/test/run.sh

  stockage:
    name: Magasin d'objets (MinIO reel, volume neuf, redemarrage)
    runs-on: ubuntu-latest
    # POURQUOI CE JOB EXISTE, ET POURQUOI IL EST SEPARE DE `schema`
    # -------------------------------------------------------------
    # Les livrables ne vivaient que sur le DISQUE LOCAL du conteneur d'API.
    # Deux instances derriere un repartiteur ne partagent pas ce disque: la
    # moitie des telechargements aurait rendu 503 sur des livrables
    # parfaitement enregistres. Un adaptateur S3 ferme ce defaut — a condition
    # d'etre eprouve contre un serveur REEL, pas contre un faux client.
    #
    # IL EST SEPARE PARCE QU'IL EXIGE DOCKER. `db/test/run.sh` tourne aussi
    # sur des postes sans demon Docker; y inscrire ce harnais le rendrait
    # rouge pour l'outillage et non pour le produit — exactement le defaut que
    # `api_e2e.sh` avait cause au commit 2e342ec.
    #
    # CE QU'IL ETABLIT: le protocole S3 tel que MinIO l'implemente. Ni AWS S3
    # ni Supabase Storage ne sont joints d'ici, et `SUPABASE_UNVERIFIED` reste
    # vrai.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # LE MOTEUR: le harnais lit l'edition en vigueur dans le registre
      # national pour poser la portee des habilitations du quatre-yeux. Une
      # edition inventee ferait refuser la proposition bien avant que le
      # magasin d'objets ne soit atteint.
      - name: Moteur (registre national lu par le harnais)
        run: pip install -e engine

      - name: Pilote PostgreSQL
        run: |
          pip install psycopg2-binary
          python -c "import psycopg2; print('pilote present:', psycopg2.__version__)"

      # L'EXTRA `dev` PORTE `httpx`, qu'exige `fastapi.testclient.TestClient`.
      # Sans lui, les deux phases du harnais echouent a la COLLECTE — pas sur
      # une assertion — et le rouge ne dirait rien du magasin d'objets.
      #
      # L'ETAPE VERIFIE SON PROPRE EFFET, `TestClient` compris.
      - name: Tranche applicative
        run: |
          pip install -e "api[dev]"
          python - <<'PY'
          import fastapi, jwt, eurostruct_api
          from fastapi.testclient import TestClient   # exige httpx
          from eurostruct_api.s3 import ClientS3      # l'adaptateur eprouve ici
          print("API prete:", fastapi.__version__, "| S3 importable")
          PY

      - name: Client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # L'IMAGE EST TIREE EXPLICITEMENT, ET EPINGLEE.
      #
      # Separement du harnais, et c'est deliberé: un echec de `pull` doit se
      # lire comme un echec de `pull`, pas comme un magasin d'objets qui ne
      # demarre pas. La version est LUE DANS `compose.yaml` — la composition et
      # la preuve ne peuvent donc pas deriver l'une de l'autre.
      - name: Image MinIO (epinglee, identique a la composition)
        run: |
          set -euo pipefail
          IMAGE="$(grep -m1 -oE 'minio/minio:RELEASE\.[0-9A-Za-z.-]+' compose.yaml)"
          [ -n "$IMAGE" ] || { echo "aucune image MinIO epinglee dans compose.yaml" >&2; exit 1; }
          echo "image de la composition: $IMAGE"
          docker pull "$IMAGE"
          echo "EUROSTRUCT_MINIO_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # LES DIX ETAPES: volume neuf, compartiment cree par notre propre
      # signature SigV4, depot par les routes reelles, arret de l'API et
      # redemarrage de MinIO, telechargement dans un processus neuf,
      # comparaison du SHA, refus inter-organisations, ENUMERATION paginee,
      # RAPPROCHEMENT base/compartiment, destruction propre.
      - name: Depot, redemarrage, rapprochement (dix etapes)
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          # Le conteneur `services:` de ce job est cree pour lui et detruit
          # avec lui. La declaration est faite ICI, dans le workflow, et jamais
          # dans les scripts: un harnais qui se donnerait a lui-meme son
          # consentement ne serait plus une barriere.
          EUROSTRUCT_CLUSTER_JETABLE: oui-cluster-jetable-et-isole
        run: ./db/test/stockage_s3.sh escs3ci

      # LA DESTRUCTION EST DANS LE PIEGE DE SORTIE DU HARNAIS. Celle-ci couvre
      # l'annulation du job, ou le piege ne tourne pas. Elle ne vise QUE le
      # prefixe que le harnais se donne, sur un runner ephemere qui ne porte
      # rien d'autre.
      - name: Reste-t-il un conteneur ou un volume du harnais
        if: always()
        run: |
          set -u
          for nom in $(docker ps -aq --filter 'name=^esc-s3-' 2>/dev/null); do
            docker rm -f "$nom" || true
          done
          for vol in $(docker volume ls -q --filter 'name=^esc-s3-' 2>/dev/null); do
            docker volume rm "$vol" || true
          done
          echo "conteneurs esc-s3-* restants: $(docker ps -aq --filter 'name=^esc-s3-' | wc -l)"
          echo "volumes esc-s3-* restants:    $(docker volume ls -q --filter 'name=^esc-s3-' | wc -l)"

  composition:
    name: Composition de production (images construites, pile demarree)
    runs-on: ubuntu-latest
    # CE JOB NE PUBLIE RIEN. Il construit les trois images LOCALEMENT, monte la
    # composition sur un volume neuf, la fait servir, et detruit tout. Aucun
    # `login`, aucun `push`, aucun registre: publier depuis une branche de
    # travail mettrait en ligne un artefact que personne n'a approuve.
    #
    # POURQUOI CE JOB EXISTE
    # -----------------------
    # `docker compose config` disait que le fichier etait bien forme. Il ne
    # disait rien du demarrage. Mesure: l'image de l'API ne s'etait JAMAIS
    # construite — trois `pip install --prefix` successifs, dont le second ne
    # voyait pas le moteur que le premier venait d'installer hors des chemins
    # interroges — et la base demarrait vierge, sans migration ni role
    # applicatif. Les deux defauts sont invisibles a tout ce qui ne construit
    # pas et ne demarre pas.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # LE MOTEUR EST INSTALLE POUR LA PREUVE, PAS POUR L'IMAGE. Le harnais lit
      # l'edition en vigueur dans le registre national plutot que de l'ecrire
      # en dur: une portee d'habilitation sur une edition inventee ferait
      # refuser la proposition avant d'atteindre ce que la preuve eprouve.
      - name: Moteur (lecture du registre par le harnais)
        run: pip install -e engine

      # LES TROIS IMAGES, CONSTRUITES EXPLICITEMENT.
      #
      # Separement du demarrage, et c'est deliberé: un echec de build doit se
      # lire comme un echec de build. Construites dans le meme `docker compose
      # build`, elles portent les noms que la composition attend, et l'etape
      # suivante n'a plus qu'a les monter.
      - name: Construction des images (aucune publication)
        env:
          # L'IDENTITE DU BUILD, INJECTEE PAR LA CI ET GRAVEE DANS L'IMAGE.
          #
          # `github.sha` designe exactement le code construit. L'image ne lit
          # jamais `.git` — elle n'en a pas — et un calcul enregistre sans
          # cette identite est refuse: une ligne conservee dix ans ne peut pas
          # designer un code qu'elle ne sait pas nommer.
          EUROSTRUCT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp deploy/local.env.example /tmp/ci.env
          echo "EUROSTRUCT_BUILD_SHA=${EUROSTRUCT_BUILD_SHA}" >> /tmp/ci.env
          docker compose --env-file /tmp/ci.env -p esc-preuve-b build
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '^esc-preuve-b-'

      # LA COMPOSITION, DEPUIS UN VOLUME NEUF, AVEC L'EMETTEUR LOCAL FICTIF.
      #
      # Le harnais pose lui-meme son emetteur (accounts FICTIF, cles generees a
      # la volee), ecrit un fichier d'environnement temporaire, attend les
      # services, verifie /health, /ready, le plan de charge, le parcours
      # d'autorite complet — composer, proposer, refuser l'auto-approbation,
      # approuver, consommer — puis redemarre sur le MEME volume et detruit
      # tout, volume compris.
      - name: Composition depuis un volume vide
        env:
          EUROSTRUCT_PREUVE_SANS_BUILD: oui
          EUROSTRUCT_BUILD_SHA: ${{ github.sha }}
        run: ./db/test/composition_depuis_zero.sh

      # LA DESTRUCTION EST DANS LE PIEGE DE SORTIE DU HARNAIS. Celle-ci couvre
      # l'annulation du job, ou le piege ne tourne pas.
      - name: Destruction de la composition et du volume
        if: always()
        run: |
          docker compose -p esc-preuve-b down -v --remove-orphans || true
