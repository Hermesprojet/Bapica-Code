# La CI appelle EXACTEMENT la meme commande que le poste de travail.
#
# Deux commandes distinctes, meme quand elles lancent les memes tests, finissent
# par diverger — et c'est alors le rapport local qui ment. Un seul script, ici
# et la-bas.
#
# --require-db rend la surface SQL OBLIGATOIRE en CI: une base est fournie par
# le service ci-dessous, donc une surface non executee y est un echec, pas un
# « partiel » tolere.
name: eurostruct — tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: dependances
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv-eurostruct"
          source "$GITHUB_WORKSPACE/.venv-eurostruct/bin/activate"
          python -m pip install --upgrade pip
          pip install -e eurostruct/engine
          pip install -e eurostruct/tools/ndp_import
          pip install pytest

      # LE PILOTE POSTGRESQL, POUR LE CONTRAT DU PROVIDER.
      #
      # SANS LUI CE WORKFLOW EST ROUGE, ET IL L'A ETE LONGTEMPS.
      # `db/test/provider_contract.sh` verifie `import psycopg2` avant de poser
      # le moindre decor, et rend 4 — NON EXECUTE — s'il manque. Avec
      # `--require-db`, `run.sh` compte cette surface comme manquante, donc
      # rouge: « 1 surface NON EXECUTEE — contrat du provider ». Ce refus est
      # VOULU; ce qui ne l'etait pas, c'est que l'outillage le provoque.
      #
      # LA DERIVE ETAIT ENTRE LES DEUX WORKFLOWS: `eurostruct.yml` installe ce
      # paquet par une etape dediee, celui-ci ne l'installait pas. Le poste de
      # travail, lui, a le pilote — d'ou un rouge visible en CI seulement, et
      # invisible a la relecture locale.
      #
      # IL ENTRE DANS LE VENV, PAS DANS LE MOTEUR. `run_tests.sh` active
      # `$GITHUB_WORKSPACE/.venv-eurostruct`; le pilote doit donc y etre, et
      # nulle part ailleurs. `postgres_provider.py` n'importe aucun pilote — il
      # recoit une connexion qui satisfait un `Protocol` — et le moteur doit
      # rester installable sans base. En faire une dependance du moteur
      # detruirait cette propriete, que `engine/tests` prouve.
      #
      # L'ETAPE VERIFIE SON PROPRE EFFET: un `pip install` qui reussit sans que
      # `import psycopg2` fonctionne dans le venv laisserait la surface non
      # executee, et l'on chercherait la panne ailleurs.
      - name: Pilote PostgreSQL (contrat du provider)
        run: |
          source "$GITHUB_WORKSPACE/.venv-eurostruct/bin/activate"
          pip install psycopg2-binary
          python -c "import psycopg2; print('pilote present:', psycopg2.__version__)"

      # LA TRANCHE APPLICATIVE. Elle est installee dans le MEME venv, parce
      # que `db/test/api_e2e.sh` lance `python3 -m pytest` et doit y trouver
      # FastAPI, PyJWT et `eurostruct_api`. Sans eux ce harnais rend 4 — NON
      # EXECUTE — et `--require-db` en fait un rouge, ce qui est le
      # comportement voulu: une surface qu'on n'a pas pu exercer n'est pas une
      # surface qui a tenu.
      - name: dependances de la tranche applicative
        run: |
          source "$GITHUB_WORKSPACE/.venv-eurostruct/bin/activate"
          pip install -e eurostruct/api
          python -c "import fastapi, jwt, eurostruct_api; print('API prete')"

      - name: client postgresql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # LA commande canonique. Rien d'autre ne doit lancer de tests ici.
      - name: suite canonique
        env:
          # Le conteneur `services:` de ce job est cree pour lui et detruit
          # avec lui. La suite cree et detruit des ROLES GLOBAUX; sans cette
          # declaration elle refuse de demarrer, ce qui est le comportement
          # voulu partout ailleurs. La declaration est faite ICI et jamais
          # dans les scripts: un harnais qui se donnerait a lui-meme son
          # consentement ne serait plus une barriere.
          EUROSTRUCT_CLUSTER_JETABLE: oui-cluster-jetable-et-isole
        run: |
          set -o pipefail
          ./eurostruct/run_tests.sh --require-db 2>&1 | tee "$RUNNER_TEMP/suite.log"

      # LE VERDICT DOIT ETRE LISIBLE DANS LA CI, ET IL NE L'ETAIT PAS.
      #
      # Le journal d'un job se termine par celui du conteneur `services:`
      # PostgreSQL, qui bavarde beaucoup. L'API de GitHub ne rend que la FIN du
      # journal: le tableau des surfaces, imprime bien plus haut, etait
      # inatteignable. On lisait des lignes de checkpoint pendant qu'on
      # cherchait pourquoi la suite avait echoue.
      #
      # `if: always()` — le resume sert surtout quand la suite ECHOUE.
      # LE VERDICT REMONTE EN ANNOTATIONS ET EN RESUME, PAS SEULEMENT EN
      # JOURNAL.
      #
      # Mesure du 30/08: l'API de GitHub ne rend, pour ce job, QUE le journal
      # du conteneur `services:` PostgreSQL — quatre cents lignes de
      # checkpoints. La sortie des etapes n'y figure pas du tout. Un `tail`
      # dans une etape n'aide donc personne qui lit par l'API.
      #
      # `::error::` produit une ANNOTATION, exposee par l'API des check-runs et
      # affichee en tete de PR. `$GITHUB_STEP_SUMMARY` produit un resume lisible
      # sur la page du run. Les deux survivent la ou le journal ne survit pas.
      - name: verdict de la suite
        if: always()
        run: |
          {
            echo "## Suite canonique"
            echo '```'
            tail -n 32 "$RUNNER_TEMP/suite.log" 2>/dev/null || echo "(aucun journal)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Les lignes qui portent une anomalie deviennent des annotations.
          grep -nE "ROUGE|ECHEC|ATTENTION|NON EXECUTE|^FAILED|^ERROR" \
               "$RUNNER_TEMP/suite.log" 2>/dev/null | head -n 25 \
            | while IFS= read -r ligne; do
                echo "::error title=suite canonique::${ligne}"
              done

          # Le tableau des surfaces, en annotations lui aussi: c'est lui qui
          # dit QUELLE surface a lache, et il tient en six lignes.
          sed -n '/^ SURFACE/,/^ VERDICT/p' "$RUNNER_TEMP/suite.log" 2>/dev/null \
            | while IFS= read -r ligne; do
                [ -n "${ligne// /}" ] && echo "::error title=surfaces::${ligne}"
              done
          true

      # L'INTERFACE EST UNE SURFACE COMME UNE AUTRE. Le typecheck est ce qui
      # empeche l'ecran d'afficher un champ que le contrat ne porte plus: il a
      # deja refuse `clause.reference`, invente a la main, la ou le contrat
      # genere dit `clause.cite`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: interface — dependances
        working-directory: eurostruct/web
        run: npm ci --no-audit --no-fund

      - name: interface — typecheck
        working-directory: eurostruct/web
        run: npm run typecheck

      - name: interface — build
        working-directory: eurostruct/web
        run: npm run build
