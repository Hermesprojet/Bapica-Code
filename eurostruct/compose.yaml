# EUROSTRUCT — exécution de production, EN LOCAL
#
#     cd eurostruct
#     cp deploy/local.env.example deploy/local.env   # puis remplir
#     docker compose --env-file deploy/local.env up --build
#
# CE QUE CE FICHIER EST, ET CE QU'IL N'EST PAS
# ---------------------------------------------
# Il fait tourner les **artefacts construits** — les deux images de production
# — sur un poste, avec un PostgreSQL local. C'est la répétition générale du
# déploiement : les processus sont ceux qui tourneront ailleurs, servis par
# `next start` et `uvicorn`, non par un serveur de développement.
#
# CE N'EST PAS UN DEPLOIEMENT, et il ne prouve rien sur un hébergeur. Il ne
# prouve rien non plus sur Supabase : `SUPABASE_UNVERIFIED` reste vrai tant
# qu'un staging réel n'a pas été éprouvé de bout en bout.
#
# AUCUN SECRET N'EST ECRIT ICI
# -----------------------------
# Pas un mot de passe, pas une clé, pas une DSN. Tout vient d'un fichier
# d'environnement que Git ignore (`deploy/local.env`), dont seul le gabarit est
# versionné. Un fichier de composition qui porte un mot de passe « juste pour
# le local » finit dans l'historique, et l'historique ne s'oublie pas.

name: eurostruct

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # AUCUN PORT PUBLIE. La base n'est jointe que par le réseau de la
    # composition. L'exposer sur l'hôte « pour regarder avec psql » est la
    # façon la plus courante de laisser une base de test ouverte sur un
    # réseau d'entreprise.
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` INTERROGE LE SERVEUR, il ne lit pas un fichier de PID.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # L'INITIALISATION — elle ne sert rien, elle prepare, puis elle SORT.
  #
  # SANS ELLE, `db` DEMARRAIT UNE IMAGE POSTGRESQL VIERGE: aucune migration,
  # aucun role applicatif, aucune racine d'autorite — et l'API s'y connectait
  # avec `POSTGRES_USER`, le superutilisateur de l'image, pour qui RLS ne
  # s'applique pas. La composition montait, et ne servait rien.
  #
  # ELLE EST IDEMPOTENTE, et c'est le REGISTRE de migrations qui le rend vrai,
  # pas une propriete des fichiers SQL. Relancee sur un volume deja initialise,
  # elle constate et sort en 0.
  init:
    build:
      context: .
      dockerfile: deploy/Dockerfile.init
    environment:
      # LE SUPERUTILISATEUR N'EST UTILISE QUE LA: creer des roles est le seul
      # acte qui l'exige. L'API ne le voit jamais.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUROSTRUCT_DB_HOST: db
      EUROSTRUCT_DB_PORT: "5432"
      EUROSTRUCT_MIGRATOR_DB_USER: ${EUROSTRUCT_MIGRATOR_DB_USER:-eurostruct_migrator}
      EUROSTRUCT_MIGRATOR_DB_PASSWORD: ${EUROSTRUCT_MIGRATOR_DB_PASSWORD}
      EUROSTRUCT_PLAN_DB_USER: ${EUROSTRUCT_PLAN_DB_USER:-eurostruct_plan}
      EUROSTRUCT_PLAN_DB_PASSWORD: ${EUROSTRUCT_PLAN_DB_PASSWORD}
      EUROSTRUCT_APP_DB_USER: ${EUROSTRUCT_APP_DB_USER}
      EUROSTRUCT_APP_DB_PASSWORD: ${EUROSTRUCT_APP_DB_PASSWORD}
      # LOCAL UNIQUEMENT. En production c'est Supabase qui pose `auth.users`
      # et `auth.uid()`; ce drapeau demande un schema FICTIF a leur place, et
      # il n'est jamais mis par defaut.
      EUROSTRUCT_LOCAL_AUTH_STUB: ${EUROSTRUCT_LOCAL_AUTH_STUB:-non}
      # LE MANDAT D'AMORCAGE. Sans lui, aucune racine d'autorite n'est amorcee
      # — designer la premiere personne habilitee est une decision prise hors
      # du systeme, pas un effet de bord du demarrage.
      EUROSTRUCT_BOOTSTRAP_MANDATE: ${EUROSTRUCT_BOOTSTRAP_MANDATE:-}
      EUROSTRUCT_BOOTSTRAP_ACTOR: ${EUROSTRUCT_BOOTSTRAP_ACTOR:-}
      EUROSTRUCT_BOOTSTRAP_NAME: ${EUROSTRUCT_BOOTSTRAP_NAME:-}
      EUROSTRUCT_BOOTSTRAP_REASON: ${EUROSTRUCT_BOOTSTRAP_REASON:-}
    depends_on:
      db:
        condition: service_healthy
    # ELLE NE REDEMARRE PAS. Une initialisation qui echoue doit rester echouee
    # et visible: `restart: unless-stopped` la ferait boucler, et la
    # composition semblerait « en cours de demarrage » indefiniment.
    restart: "no"

  # LE MAGASIN D'OBJETS. Un MinIO REEL, qui parle le protocole S3.
  #
  # POURQUOI IL REMPLACE LE DISQUE LOCAL
  # -------------------------------------
  # Un volume nomme repoussait le probleme d'un cran, il ne le fermait pas.
  # DEUX INSTANCES D'API DERRIERE UN REPARTITEUR NE PARTAGENT PAS UN DISQUE:
  # la moitie des telechargements rendrait 503 sur des livrables parfaitement
  # enregistres. Et un document conserve dix ans au titre de la decennale ne
  # peut pas dependre du disque d'une machine.
  #
  # CE QUE CE SERVICE ETABLIT, ET CE QU'IL N'ETABLIT PAS. Il fait tourner le
  # PROTOCOLE en local; il ne dit rien d'AWS S3 ni de Supabase Storage, qu'on
  # n'a pas joints. `SUPABASE_UNVERIFIED` reste vrai.
  #
  # LA VERSION EST EPINGLEE. `latest` ferait changer le magasin d'une
  # composition a l'autre sans qu'un seul fichier du depot ne bouge — ce qu'un
  # enregistrement conserve dix ans ne supporte pas.
  objets:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      # LES MEMES VALEURS QUE CELLES QUE L'API PRESENTE. Une composition ou le
      # magasin et son client ne partagent pas les identifiants demarre
      # parfaitement, et refuse chaque depot.
      MINIO_ROOT_USER: ${EUROSTRUCT_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${EUROSTRUCT_S3_SECRET_ACCESS_KEY}
    # AUCUN PORT PUBLIE. Le compartiment est PRIVE et n'est joint que par le
    # reseau de la composition: l'exposer sur l'hote « pour regarder avec un
    # navigateur » est la facon la plus courante de laisser un magasin de
    # documents ouvert sur un reseau d'entreprise.
    volumes:
      - objets:/data
    healthcheck:
      # `curl` EST DANS L'IMAGE — verifie, pas suppose. La sonde INTERROGE le
      # service; elle ne cherche pas un processus.
      test: ["CMD-SHELL",
             "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # LE COMPARTIMENT EST PROVISIONNE ICI, PAS PAR LE PRODUIT.
  #
  # `StockageS3` NE CREE AUCUN COMPARTIMENT dans le chemin de service, et c'est
  # deliberé: un service qui creerait le sien au demarrage masquerait une
  # erreur de configuration — il ecrirait dans un compartiment NEUF au lieu de
  # refuser parce que celui qu'on a nomme n'existe pas, et les livrables
  # partiraient dans le vide, sans un mot.
  #
  # LES IDENTIFIANTS PASSENT PAR `MC_HOST_*`, JAMAIS PAR `argv`. Une commande
  # qui porte un secret le montre a `docker inspect` et a tout `ps` du
  # conteneur.
  #
  # `mc anonymous set none` EST EXPLICITE, pas decoratif: un compartiment
  # public exposerait des notes de calcul nominatives a qui devine une URL.
  objets-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing "esc/${EUROSTRUCT_S3_BUCKET:-eurostruct-livrables}"
        && mc anonymous set none "esc/${EUROSTRUCT_S3_BUCKET:-eurostruct-livrables}"
    environment:
      MC_HOST_esc: >-
        http://${EUROSTRUCT_S3_ACCESS_KEY_ID}:${EUROSTRUCT_S3_SECRET_ACCESS_KEY}@objets:9000
    depends_on:
      objets:
        condition: service_healthy
    # ELLE NE REDEMARRE PAS. Un provisionnement qui echoue doit rester echoue
    # et visible.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # LES SECRETS DE RUNTIME DE L'API. Ils ne traversent JAMAIS le build:
      # ils ne sont ni des `ARG`, ni des `ENV` de l'image.
      #
      # LE LOGIN EST CELUI DE L'APPLICATION, PAS `POSTGRES_USER`. Le second est
      # le superutilisateur de l'image: RLS ne s'applique pas a lui, et toutes
      # les politiques que les migrations posent deviendraient decoratives.
      EUROSTRUCT_DATABASE_URL: >-
        postgresql://${EUROSTRUCT_APP_DB_USER}:${EUROSTRUCT_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      EUROSTRUCT_SUPABASE_JWKS_URL: ${EUROSTRUCT_SUPABASE_JWKS_URL}
      EUROSTRUCT_SUPABASE_ISSUER: ${EUROSTRUCT_SUPABASE_ISSUER}
      EUROSTRUCT_SUPABASE_AUDIENCE: ${EUROSTRUCT_SUPABASE_AUDIENCE:-authenticated}
      EUROSTRUCT_JWT_ALGORITHMS: ${EUROSTRUCT_JWT_ALGORITHMS:-RS256}
      # LES ORIGINES SONT DECLAREES, JAMAIS `*` — la configuration refuse le
      # joker, et le port est celui que l'interface publie sur l'hôte.
      EUROSTRUCT_CORS_ORIGINS: ${EUROSTRUCT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # L'IDENTITE DU BUILD. Gravee dans l'image a la construction, elle peut
      # etre surchargee ici — c'est le cas d'une image rejouee sous un autre
      # nom. Sans elle, l'API sert le calcul EXPLORATOIRE et refuse
      # d'ENREGISTRER: une ligne conservee dix ans ne peut pas designer un code
      # qu'elle ne sait pas nommer.
      EUROSTRUCT_BUILD_SHA: ${EUROSTRUCT_BUILD_SHA:-}
      # LE MAGASIN D'OBJETS.
      #
      # `s3` PAR DEFAUT, ET C'EST LE CHANGEMENT DE CE LOT. Le disque local
      # reste atteignable (`EUROSTRUCT_STORAGE_BACKEND=local`) pour un poste
      # sans magasin objet, mais la composition de reference — celle qui
      # repete le deploiement — passe par le protocole.
      #
      # AUCUN REPLI DE `s3` VERS LE DISQUE. Une configuration S3 incomplete
      # fait REFUSER la creation d'un livrable par un 503 explicite; elle
      # n'ecrit rien sur un disque de conteneur qui disparaitrait au prochain
      # `--force-recreate`, en laissant en base des lignes qui promettent des
      # documents introuvables.
      EUROSTRUCT_STORAGE_BACKEND: ${EUROSTRUCT_STORAGE_BACKEND:-s3}
      # LE REPLI DECLARE, utilise UNIQUEMENT si le backend vaut `local`. Le
      # volume reste monte pour qu'un basculement ne perde pas ce qui y a ete
      # ecrit avant.
      EUROSTRUCT_STORAGE_DIR: /var/lib/eurostruct/livrables
      # LE COMPARTIMENT EST JOINT PAR LE RESEAU DE LA COMPOSITION. `objets`
      # n'est pas publie sur l'hote, et le style CHEMIN est necessaire: un
      # style « hote virtuel » exigerait un DNS par compartiment.
      EUROSTRUCT_S3_ENDPOINT: ${EUROSTRUCT_S3_ENDPOINT:-http://objets:9000}
      EUROSTRUCT_S3_REGION: ${EUROSTRUCT_S3_REGION:-us-east-1}
      EUROSTRUCT_S3_BUCKET: ${EUROSTRUCT_S3_BUCKET:-eurostruct-livrables}
      EUROSTRUCT_S3_PREFIX: ${EUROSTRUCT_S3_PREFIX:-livrables}
      EUROSTRUCT_S3_PATH_STYLE: ${EUROSTRUCT_S3_PATH_STYLE:-oui}
      EUROSTRUCT_S3_ACCESS_KEY_ID: ${EUROSTRUCT_S3_ACCESS_KEY_ID}
      EUROSTRUCT_S3_SECRET_ACCESS_KEY: ${EUROSTRUCT_S3_SECRET_ACCESS_KEY}
      # TLS. En clair sur le reseau interne d'une composition locale; chez un
      # fournisseur, l'endpoint est en `https://` et la verification reste a
      # `oui`. La desactiver est une decision qui doit s'ecrire.
      EUROSTRUCT_S3_VERIFY_TLS: ${EUROSTRUCT_S3_VERIFY_TLS:-oui}
      EUROSTRUCT_S3_CA_BUNDLE: ${EUROSTRUCT_S3_CA_BUNDLE:-}
      # CHIFFREMENT AU REPOS, cote serveur. Vide ici: MinIO en composition
      # locale n'a pas de KMS, et declarer `aws:kms` sans clé ferait refuser
      # chaque depot. Chez un fournisseur qui le porte, `AES256` ou `aws:kms`.
      EUROSTRUCT_S3_SSE: ${EUROSTRUCT_S3_SSE:-}
      EUROSTRUCT_S3_SSE_KMS_KEY_ID: ${EUROSTRUCT_S3_SSE_KMS_KEY_ID:-}
    volumes:
      - livrables:/var/lib/eurostruct/livrables
    depends_on:
      db:
        condition: service_healthy
      # LA SORTIE EN 0 DE L'INITIALISATION, PAS SA SEULE EXECUTION. Avec
      # `service_started`, l'API demarrerait pendant les migrations et
      # rendrait des 500 jusqu'a ce qu'elles finissent — ou indefiniment si
      # elles echouent.
      init:
        condition: service_completed_successfully
      # LE COMPARTIMENT EXISTE AVANT QUE L'API NE SERVE. Sans cette attente,
      # les premiers depots refuseraient par 503 pendant quelques secondes,
      # pour une raison qui n'a rien a voir avec la demande.
      objets-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # `/health`, PAS `/ready`. Cette sonde décide de REDEMARRER: la lier aux
      # dépendances ferait tuer un processus parfaitement sain parce que la
      # base est lente — une panne fabriquée par la sonde. `/ready` sert à
      # router, et se lit de l'extérieur.
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # ARRET PROPRE. `uvicorn` reçoit SIGTERM (il est PID 1), ferme ses
    # connexions en cours, puis sort. Vingt secondes couvrent la fenêtre de
    # grâce du serveur, plus une marge.
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # AUCUN `NEXT_PUBLIC_*` ICI, ET C'EST TOUT L'INTERET. Ces variables sont
      # lues par le layout — un composant serveur — A CHAQUE REQUETE, et
      # déposées dans la page. Rien n'est inliné dans le bundle, donc la même
      # image sert n'importe quel environnement.
      #
      # L'adresse est celle que le NAVIGATEUR doit joindre, pas celle du
      # réseau interne: c'est le navigateur de l'utilisateur qui appelle
      # l'API, et il ne connaît pas le nom `api`.
      EUROSTRUCT_API_URL: ${EUROSTRUCT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      EUROSTRUCT_SUPABASE_URL: ${EUROSTRUCT_PUBLIC_SUPABASE_URL:-}
      EUROSTRUCT_SUPABASE_ANON_KEY: ${EUROSTRUCT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL",
             "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  db:
  # LE MAGASIN D'OBJETS. C'est lui qui porte les livrables depuis ce lot: le
  # volume survit au conteneur MinIO, et le harnais `db/test/stockage_s3.sh`
  # le prouve en redemarrant le serveur entre le depot et la relecture.
  objets:
  # LE REPLI SUR DISQUE, monte meme quand le backend est `s3`. Il n'est ecrit
  # que si `EUROSTRUCT_STORAGE_BACKEND=local`; le garder evite qu'un
  # basculement de backend perde ce qui y a ete depose avant.
  livrables:
