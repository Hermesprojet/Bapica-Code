<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    LA COUPE D'UNE POUTRE, ET RIEN D'AUTRE.

    ELLE EXISTE POUR UNE RAISON TECHNIQUE AUTANT QUE POUR L'ONGLET. Sans
    icone, le navigateur demande `/favicon.ico`, obtient 404, et l'inscrit
    dans la console. Le parcours Chromium echoue desormais sur toute erreur de
    console: une 404 permanente y noierait les vraies.
  -->
  <rect width="32" height="32" rx="6" fill="#16181d"/>
  <rect x="8" y="6" width="16" height="20" rx="1.5"
        fill="none" stroke="#e9eaee" stroke-width="1.6"/>
  <circle cx="12" cy="22" r="1.6" fill="#e9eaee"/>
  <circle cx="20" cy="22" r="1.6" fill="#e9eaee"/>
  <circle cx="12" cy="10" r="1.1" fill="#a2a9b8"/>
  <circle cx="20" cy="10" r="1.1" fill="#a2a9b8"/>
</svg>
