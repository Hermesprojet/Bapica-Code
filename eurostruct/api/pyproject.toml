[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurostruct-api"
version = "0.1.0"
description = "HTTP layer for EUROSTRUCT. Separate from the deterministic engine on purpose."
requires-python = ">=3.11"
dependencies = [
    "eurostruct-engine>=0.3.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    # LE PILOTE ET LA CRYPTO SONT DES DEPENDANCES DE **CETTE** COUCHE.
    # Le moteur, lui, n'en a aucune: son provider s'appuie sur un `Protocol`,
    # et l'y ajouter transformerait une frontiere en couplage. C'est ici, et
    # seulement ici, qu'on parle a PostgreSQL et qu'on verifie une signature.
    "psycopg2-binary>=2.9",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: exige un PostgreSQL jetable et un consentement explicite",
]
